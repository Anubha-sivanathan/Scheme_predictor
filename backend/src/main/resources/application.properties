spring.application.name=scheme-predictor-backend
server.port=8080

# ---- MongoDB ----
# Using embedded MongoDB - no external database needed!
spring.data.mongodb.database=scheme_predictor

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please-32chars-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- AI Services ----
app.services.recommendation-url=${RECOMMENDATION_SERVICE_URL:http://localhost:5001}
app.services.ocr-url=${OCR_SERVICE_URL:http://localhost:5002}

# ---- File uploads ----
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Logging ----
logging.level.com.schemepredictor=INFO

# ---- Sharing ----
# Aadhaar documents are never shareable unless this is explicitly enabled.
app.share.allow-sensitive=${SHARE_ALLOW_SENSITIVE:false}
app.share.rate-limit-per-minute=${SHARE_RATE_LIMIT_PER_MINUTE:30}
